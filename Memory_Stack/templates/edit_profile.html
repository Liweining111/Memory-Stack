{% extends "layout.html" %}

{% block title %}修改个人信息{% endblock %}

{% block content %}
    <h2>编辑个人信息</h2>
    <form method="POST" action="{{ url_for('edit_profile') }}">
        <div class="form-group">
            <label for="nickname">昵称：</label>
            <input type="text" id="nickname" name="nickname" class="form-control" value="{{ user['nickname'] or '' }}" required>
        </div>

        <div class="form-group">
            <label for="signature">个性签名：</label>
            <input type="text" id="signature" name="signature" class="form-control" value="{{ user['signature'] or '' }}">
        </div>

        <div class="form-group">
            <label for="gender">性别：</label>
            <select id="gender" name="gender" class="form-control" required>
                <option value="male" {% if user['gender'] == 'male' %}selected{% endif %}>男</option>
                <option value="female" {% if user['gender'] == 'female' %}selected{% endif %}>女</option>
            </select>
        </div>

        <div class="form-group">
            <label>选择头像：</label>
            <div class="avatar-grid">
                {% for avatar in avatars %}
                    <label class="avatar-option">
                        <input type="radio" name="avatar" value="{{ avatar }}" {% if user['avatar'] == avatar %}checked{% endif %} required>
                        <img src="{{ url_for('static', filename='images/' + avatar) }}" alt="{{ avatar }}" class="avatar-image {% if user['avatar'] == avatar %}selected{% endif %}">
                    </label>
                {% endfor %}
            </div>
        </div>

        <div class="form-group">
            <label for="posts">我的动态：</label>
            <ul>
                {% for post in posts %}
                    <li>{{ post.title }} - {{ post.created_at }}</li>
                {% endfor %}
            </ul>
        </div>


        <div class="form-group">
            <button type="submit" class="btn">保存</button>
            <a href="{{ url_for('index') }}" class="btn">跳过</a>
        </div>
    </form>
    <style>
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .avatar-option {
            display: inline-block;
            cursor: pointer;
        }
        .avatar-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s;
        }
        .avatar-image.selected,
        .avatar-option input:checked + img {
            border-color: #007bff;
        }
        .avatar-option input {
            display: none;
        }
    </style>
{% endblock %}
