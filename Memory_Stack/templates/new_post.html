{% extends 'layout.html' %}

{% block title %}发布新内容 - Memory Stack{% endblock %}

{% block content %}
    <h2>发布新内容</h2>
    <form method="post" enctype="multipart/form-data" id="postForm">
        <div class="form-group">
            <label for="title">标题</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="content">内容</label>
            <textarea class="form-control" id="content" name="content" required></textarea>
        </div>
        <div class="form-group">
            <label for="images">上传图片（最多9张）</label>
            <input type="file" class="form-control" id="images" name="images" accept="image/png,image/jpeg,image/jpg,image/gif" multiple>
            <small class="form-text text-muted">支持PNG、JPG、JPEG、GIF格式，最大24MB</small>
            <div id="imagePreview" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;"></div>
        </div>
        <button type="submit" class="btn">发布</button>
    </form>

    <!-- 引入图片预览脚本 -->
    <script src="{{ url_for('static', filename='js/new_post.js') }}"></script>
{% endblock %}
